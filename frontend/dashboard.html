<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para a Heloisa</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="travado">

<div id="entrada">
  <canvas id="ceu"></canvas>
  <div id="flash"></div>
  <div class="palco">
    <div id="iniciais">L <i>♡</i> H</div>
    <div id="boasvindas"></div>
    <button id="entrar" type="button">Entrar no nosso universo</button>
  </div>
</div>

<main>
  <section id="universo">
    <div class="nomes" id="nomes"></div>
    <p>Feito com carinho, só para você <span class="coracao">❤</span></p>
  </section>

  <section id="musica">
    <h2>Nossa música</h2>
    <div class="player">
      <div class="disco" id="disco"></div>
      <div class="faixa"><b id="titulo"></b><small id="artista"></small></div>
      <div class="ondas" id="ondas"><i></i><i></i><i></i><i></i></div>
      <div class="controles">
        <button id="playpause" type="button" aria-label="Tocar ou pausar">▶</button>
        <input id="progresso" type="range" min="0" max="100" value="0" step="0.1" aria-label="Andamento da música">
        <span class="tempo" id="tempo">0:00 / 0:00</span>
      </div>
      <label class="volume">Volume <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8"></label>
      <div id="aviso"></div>
    </div>
    <audio id="audio" preload="auto" loop playsinline></audio>
  </section>

  <section id="lembrancas">
    <h2>Nossas lembranças</h2>
    <div class="carrossel" id="carrossel" role="region" aria-label="Nossas fotos" aria-roledescription="carrossel" tabindex="0">
      <button class="carrossel-seta" id="foto-anterior" type="button" aria-label="Ver foto anterior">‹</button>
      <div class="carrossel-janela" id="carrossel-janela">
        <div class="carrossel-faixa" id="carrossel-faixa"></div>
      </div>
      <button class="carrossel-seta" id="foto-proxima" type="button" aria-label="Ver próxima foto">›</button>
      <div class="carrossel-pontos" id="carrossel-pontos" aria-label="Escolher foto"></div>
    </div>
  </section>
  <section id="tempo-juntos"><h2>Nosso tempo juntos</h2><div class="contador" id="contador"></div></section>

  <section id="carta">
    <h2>Nossa história</h2>
    <div class="perg" id="perg">
      <svg class="selo" id="selo" viewBox="0 0 130 200" aria-hidden="true">
        <defs>
          <radialGradient id="cera" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ff5a5a"/><stop offset=".55" stop-color="#d81f26"/><stop offset="1" stop-color="#8f0f18"/></radialGradient>
          <filter id="irreg"><feTurbulence baseFrequency=".06" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="7"/></filter>
        </defs>
        <path d="M38 0C20 40 24 70 52 96" fill="none" stroke="#b9790f" stroke-width="12" stroke-linecap="round"/>
        <path d="M52 0C34 40 38 70 66 96" fill="none" stroke="#b9790f" stroke-width="12" stroke-linecap="round"/>
        <path d="M38 0C20 40 24 70 52 96" fill="none" stroke="#ffc233" stroke-width="7" stroke-linecap="round"/>
        <path d="M52 0C34 40 38 70 66 96" fill="none" stroke="#ffc233" stroke-width="7" stroke-linecap="round"/>
        <g filter="url(#irreg)"><path d="M65 178C14 140 6 98 24 78c14-16 33-10 41 4 8-14 27-20 41-4 18 20 10 62-41 96z" fill="url(#cera)" stroke="#7a0b12" stroke-width="2"/></g>
        <path d="M65 160C28 130 22 100 34 88c10-10 24-6 31 6 7-12 21-16 31-6 12 12 6 42-31 72z" fill="#ef3030" stroke="#a5121b" stroke-width="2"/>
        <path d="M42 94c4-8 12-8 16-3" fill="none" stroke="#ff9a9a" stroke-width="3" stroke-linecap="round"/>
        <path d="M60 176c-6 6-14 12-20 20M72 176c4 8 12 14 22 18" fill="none" stroke="#b9790f" stroke-width="9" stroke-linecap="round"/>
        <path d="M60 176c-6 6-14 12-20 20M72 176c4 8 12 14 22 18" fill="none" stroke="#ffc233" stroke-width="5" stroke-linecap="round"/>
      </svg>
      <div class="rolo"></div>
      <div class="fio" id="fio"><div class="dentro"><div class="texto">
        <h3 id="saudacao"></h3>
        <div id="textoCarta"></div>
        <p class="assinatura" id="assinatura"></p>
      </div></div></div>
      <div class="rolo baixo"></div>
    </div>
  </section>
</main>

<script src="js/dashboard.js"></script>
</body>
</html>
